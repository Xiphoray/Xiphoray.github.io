title: Bored
layout: default
sitemap: false
---
<style>
#all{
	height: 100%;  
    width: 100%;  
    position: absolute;  
    top: 0px;  
    bottom: 0px;  
    background: #ffffff;  
	-webkit-touch-callout: none;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;
	user-select: none;
   z-index: 99999;  
	overflow:hidden; word-break:break-all; 
}
#mainContent{
   z-index: 1999999;  
}
</style>
<script src="{{ site.baseurl }}/js/jquery.min.js"></script>
<div id="all"></div>
<div id="mainContent"></div>
<script type="text/javascript">
    $(document).ready(function() {
			// 读取 URL 参数 
			const urlParams = new URLSearchParams(window.location.search); 
			const paramList = urlParams.get("list");
			var Maxsum = 10;
			var list = Math.floor(Math.random() * Maxsum ); 
			// 如果 URL 中提供了 list，则覆盖 
			if (paramList !== null && !isNaN(paramList)) 
			{ 
				if (paramList >= 0 && paramList < Maxsum ) list = parseInt(paramList, 10); 
			}
			switch (list)
			{
				case 0:
					$("#mainContent").load("{{ site.baseurl }}/bored/nothing.html");
					break;
				case 1:
					$("#mainContent").load("{{ site.baseurl }}/bored/timer.html");
					break;
				case 2:
					$("#mainContent").load("{{ site.baseurl }}/bored/keyboard.html");
					break;
				case 3:
					$("#mainContent").load("{{ site.baseurl }}/bored/breath.html");
					break;
				case 4:
					$("#mainContent").load("{{ site.baseurl }}/bored/color.html");
					break;
				case 5:
					$("#mainContent").load("{{ site.baseurl }}/bored/solarsystem.html");
					break;
				case 6:
					$("#mainContent").load("{{ site.baseurl }}/bored/salaryclock.html");
					break;
				case 7:
					$("#mainContent").load("{{ site.baseurl }}/bored/blacksun.html");
					break;
				case 8:
					$("#mainContent").load("{{ site.baseurl }}/bored/noball.html");
					break;
				case 9:
					$("#mainContent").load("{{ site.baseurl }}/bored/light.txt");
					break;
			}
			
    });
</script>
